# SonarQube - SIGER Backend (Flask). Lo lee sonarqube-scan-action desde la raiz del repositorio.
# SonarQube Cloud: organizacion y clave del proyecto (copialas tal cual de la pagina del proyecto en sonarcloud.io)
sonar.organization=roois334
sonar.projectKey=roois334_SIGER-Backend
sonar.projectName=SIGER Backend
sonar.sourceEncoding=UTF-8

# Codigo de la aplicacion y pruebas
sonar.sources=app.py,config.py,extensions.py,controllers,services,models,dtos,utilities
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=**/__pycache__/**,venv/**,_respaldo_codigo/**,static/**,uploads_privados/**

# Informes generados por pytest-cov / pytest (ver .github/workflows/ci.yml)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# El job de CI espera el veredicto del Quality Gate y falla si no se cumple
sonar.qualitygate.wait=true
